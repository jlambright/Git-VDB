[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "git-ai"
version = "0.2.0"
description = "AI-powered git CLI"
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
authors = [
  { name = "Jules", email = "jules@example.com" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]
dependencies = [
    "click",
    "pydantic",
    "requests",
    "jsonpatch",
    "pyyaml",
    "GitPython",
    "fastmcp",
    "ulid-py"
]

[project.urls]
Homepage = "https://github.com/jlambright/Git-VDB"
"Bug Tracker" = "https://github.com/jlambright/Git-VDB/issues"

[project.scripts]
git-ai = "git_ai.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/git_ai"]
