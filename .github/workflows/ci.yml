name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install flake8
          pip install -r indexer-service/requirements.txt
          pip install git-ai/

      - name: Lint with flake8
        run: |
          # stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install pytest
          pip install -e git-ai/
          # Install indexer-service deps too as some tests might import from it or need qdrant-client
          pip install -r indexer-service/requirements.txt

      - name: Run git-ai unit tests
        run: |
          pytest git-ai/tests

  integration-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Configure Git
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI Bot"

      - name: Install dependencies
        run: |
          pip install -r indexer-service/requirements.txt
          pip install -e git-ai/

      - name: Run Hot Simulation Test
        run: |
          python scripts/simulate_hot_test.py

      - name: Run MCP Server Verification
        run: |
          python scripts/verify_mcp_server.py
